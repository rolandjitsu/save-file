name: CI
on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test build artifacts
        run: |
          node -e "const s = require('./dist/index.js'); if (typeof s !== 'function') throw new Error('CJS default export is not a function');"
          node --input-type=module -e "import s from './dist/index.mjs'; if (typeof s !== 'function') throw new Error('ESM default export is not a function');"
      - name: Test
        run: npm run test:cov
      - name: Upload coverage to Coveralls
        if: matrix.node-version == 24
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          fail-on-error: false
